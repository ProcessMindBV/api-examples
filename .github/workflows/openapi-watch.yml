name: OpenAPI watch

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the public OpenAPI document
        run: |
          curl -fsS https://api.processmind.com/v1/openapi.json -o /tmp/openapi.json

      - name: Compare with the committed snapshot
        id: compare
        run: |
          mkdir -p spec
          if [ -f spec/openapi.json ] && cmp -s /tmp/openapi.json spec/openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            cp /tmp/openapi.json spec/openapi.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the refreshed snapshot to the bot branch
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c bot/openapi-sync
          git add spec/openapi.json
          git commit -m "Refresh the OpenAPI snapshot"
          git push --force origin bot/openapi-sync

      - name: Open or update the review pull request
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh pr list --head bot/openapi-sync --state open --json number --jq 'length')" = "0" ]; then
            gh pr create --base main --head bot/openapi-sync \
              --title "OpenAPI spec changed — review the examples" \
              --body "The public spec at https://api.processmind.com/v1/openapi.json changed. Review whether the examples and README still match, then merge this snapshot refresh."
          else
            echo "The review pull request is already open; the force-push updated it."
          fi

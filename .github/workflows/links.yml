name: Link check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check documentation links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,204,206,301,302,307,308,429 './**/*.md'
          fail: false

      - name: Open or update an issue when links are broken
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Broken links found by the weekly link check"
          body="$(cat ./lychee/out.md 2>/dev/null || echo 'See the latest run of the Link check workflow for details.')"
          number="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
